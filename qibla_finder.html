<body>
  <header>
    <a href="reader.html" class="home">← হোম</a>
    <h1>Qibla Finder | কিবলা ফাইন্ডার</h1>
  </header>

  <div class="container">
    <div id="loading" class="loading">অবস্থান নির্ণয় করা হচ্ছে...</div>
    <div id="error" class="error" style="display:none"></div>
    
    <div id="qiblaContent" style="display:none">
      <div class="location-info">
        <h3>আপনার অবস্থান</h3>
        <p id="locationName">-</p>
        <p id="coordinates">-</p>
      </div>

      <div class="qibla-card">
        <div class="compass-container">
          <div class="compass-dial" id="compassDial">
            <img src="./images/Qibla-1.png" class="qibla-image" alt="Qibla Compass" onerror="this.style.display='none'; console.error('Image failed to load');">
          </div>
        </div>
        <div class="qibla-label">Qibla Direction: <span id="qiblaDirection">-</span>°</div>
        <div class="qibla-hint">ফোন ঘুরিয়ে কিবলা খুঁজুন</div>
        <button id="sensorBtn" style="display:none; margin-top:14px; background:var(--gold-1); color:var(--green-1); border:none; border-radius:10px; padding:10px 22px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;">কম্পাস চালু করুন</button>
        <div id="debugInfo">
          <div>Location: <span id="debugLocation"></span></div>
          <div>Qibla Direction: <span id="debugQibla"></span>°</div>
          <div>Heading: <span id="debugHeading"></span>°</div>
          <div>Qibla Rotation: <span id="debugRotation"></span>°</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MECCA_LAT = 21.422487;
    const MECCA_LNG = 39.826206;

    function toRadians(degrees) {
      return degrees * (Math.PI / 180);
    }

    function calculateQibla(lat, lng) {
      const latRad = toRadians(lat);
      const lngRad = toRadians(lng);
      const meccaLatRad = toRadians(MECCA_LAT);
      const meccaLngRad = toRadians(MECCA_LNG);

      const y = Math.sin(meccaLngRad - lngRad);
      const x = Math.cos(latRad) * Math.tan(meccaLatRad) - 
                Math.sin(latRad) * Math.cos(meccaLngRad - lngRad);

      let qibla = Math.atan2(y, x) * (180 / Math.PI);
      qibla = (qibla + 360) % 360;
      return qibla;
    }

    function getLocationName(lat, lng) {
      return `অক্ষাংশ: ${lat.toFixed(4)}°, দ্রাঘিমাংশ: ${lng.toFixed(4)}°`;
    }

    async function initQiblaFinder() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const qiblaContent = document.getElementById('qiblaContent');

      if (!navigator.geolocation) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.textContent = 'আপনার ব্রাউজার জিওলোকেশন সাপোর্ট করে না।';
        return;
      }

      try {
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          });
        });

        const lat = position.coords.latitude;
        const lng = position.coords.longitude;

        const qiblaDirection = calculateQibla(lat, lng);
        const locationName = getLocationName(lat, lng);

        document.getElementById('locationName').textContent = locationName;
        document.getElementById('coordinates').textContent = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
        document.getElementById('qiblaDirection').textContent = Math.round(qiblaDirection);
        document.getElementById('debugLocation').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
        document.getElementById('debugQibla').textContent = qiblaDirection.toFixed(2);

        loading.style.display = 'none';
        qiblaContent.style.display = 'block';

        currentQibla = qiblaDirection;
        startCompass();

      } catch (err) {
        loading.style.display = 'none';
        error.style.display = 'block';
        error.textContent = 'অবস্থান পাওয়া যায়নি। অনুগ্রহ করে লোকেশন অনুমতি দিন।';
        console.error(err);
      }
    }

    let currentQibla = 0;
    let smoothedHeading = null;
    let compassActive = false;      // at least one absolute/webkit heading seen
    let compassStarted = false;
    let sawAnyOrientation = false;  // any orientation event, incl. relative
    let lastEventAt = 0;
    let lastRawHeading = null;
    let relativeMode = false;       // device only reports relative alpha
    let baseAlpha = null;           // calibration anchor (raw heading when facing north)
    let staticShown = false;

    function angleDelta(d) {
      return ((d + 540) % 360) - 180;
    }

    function setHint(text) {
      document.querySelector('.qibla-hint').textContent = text;
    }

    function showStaticArrow(hintText) {
      if (staticShown) return;
      staticShown = true;
      document.querySelector('.qibla-image').style.transform = `rotate(${currentQibla}deg)`;
      if (hintText) setHint(hintText);
    }

    function handleOrientation(event) {
      let heading = null;
      let reliable = false;

      if (event.webkitCompassHeading !== null && event.webkitCompassHeading !== undefined) {
        // iOS: webkitCompassHeading gives true heading from north (0-360)
        heading = event.webkitCompassHeading;
        reliable = true;
      } else if (event.alpha !== null && event.alpha !== undefined) {
        heading = 360 - event.alpha;
        reliable = (event.absolute === true);
      }

      if (heading === null || isNaN(heading)) return;

      sawAnyOrientation = true;
      lastEventAt = Date.now();
      lastRawHeading = heading;

      if (reliable) {
        compassActive = true;
      } else if (!relativeMode || baseAlpha === null) {
        // Relative alpha is anchored to an arbitrary direction — only use it
        // after the user calibrates by facing north.
        return;
      }

      let effective = heading;
      if (!reliable) {
        effective = heading - baseAlpha;  // 0 when facing the calibrated north
      }
      effective = ((effective % 360) + 360) % 360;

      staticShown = false;
      if (smoothedHeading === null) {
        smoothedHeading = effective;
      } else {
        smoothedHeading = (smoothedHeading + angleDelta(effective - smoothedHeading) * 0.3 + 360) % 360;
      }

      // Keep compass static — North always at top.
      // Rotate pointer so it points up exactly when the phone faces Qibla.
      const pointerRotation = currentQibla - smoothedHeading;
      document.querySelector('.qibla-image').style.transform = `rotate(${pointerRotation}deg)`;
      setHint('ফোন ঘুরিয়ে তীর সোজা উপরে আনুন — সেটাই কিবলা');

      document.getElementById('debugHeading').textContent = smoothedHeading.toFixed(2);
      document.getElementById('debugRotation').textContent = pointerRotation.toFixed(2);
    }

    function attachOrientationListeners() {
      window.addEventListener('deviceorientationabsolute', handleOrientation);
      window.addEventListener('deviceorientation', handleOrientation);
    }

    function startCompass() {
      if (compassStarted) return;
      compassStarted = true;

      const btn = document.getElementById('sensorBtn');

      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+: motion permission must be requested from a user gesture
        btn.style.display = 'inline-block';
        setHint('লাইভ কম্পাসের জন্য নিচের বাটনে চাপুন');
        btn.addEventListener('click', () => {
          DeviceOrientationEvent.requestPermission()
            .then(res => {
              if (res === 'granted') {
                btn.style.display = 'none';
                setHint('ফোন ঘুরিয়ে কিবলা খুঁজুন');
                attachOrientationListeners();
              }
            })
            .catch(() => {});
        });
      } else if (typeof DeviceOrientationEvent !== 'undefined') {
        attachOrientationListeners();
      }

      // After 3s decide what mode we are actually in
      setTimeout(() => {
        if (compassActive || smoothedHeading !== null) return;

        if (sawAnyOrientation) {
          // Sensor exists but never reports absolute north — use relative mode:
          // the arrow will still rotate live after a one-tap north calibration.
          relativeMode = true;
          btn.style.display = 'inline-block';
          btn.textContent = 'উত্তরে ধরে ক্যালিব্রেট করুন';
          setHint('ফোনকে সোজা উত্তর দিকে ধরে বাটনে চাপুন');
          btn.addEventListener('click', () => {
            baseAlpha = lastRawHeading;
            smoothedHeading = 0;
            btn.style.display = 'none';
            setHint('ক্যালিব্রেট হয়েছে — ফোন ঘুরিয়ে তীর উপরে আনুন');
          });
          showStaticArrow();
        } else {
          // Desktop / no sensor at all — show the Qibla angle statically
          showStaticArrow('কম্পাস সেন্সর পাওয়া যায়নি — উপরের দিককে উত্তর ধরে তীরের দিকে দাঁড়ান');
        }
      }, 3000);

      // Watchdog: if the compass stream stalls (e.g. sensor sleeps), fall back
      // to the static arrow instead of leaving a frozen wrong direction.
      setInterval(() => {
        if (lastEventAt && Date.now() - lastEventAt > 4000 && !staticShown) {
          showStaticArrow('কম্পাস সেন্সর থেমে গেছে — পেজ রিলোড করে আবার চেষ্টা করুন');
        }
      }, 2000);
    }

    initQiblaFinder();
  </script>
</body>
